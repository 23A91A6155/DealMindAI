services:
  dealmind-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HINDSIGHT_API_URL=${HINDSIGHT_API_URL:-https://api.hindsight.vectorize.io}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-dealmind-demo}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-openai/gpt-oss-120b}
      - FRONTEND_URL=*
    volumes:
      - dealmind_data:/app/backend
    restart: unless-stopped

volumes:
  dealmind_data:
